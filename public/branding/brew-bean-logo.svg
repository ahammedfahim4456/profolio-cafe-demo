<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- Wordmark "BREW & BEAN" (Left) -->
  <text x="10" y="32" fill="#10100E" font-family="'PP Mori Local', 'PP Mori', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.04em">BREW &amp;</text>
  <text x="10" y="60" fill="#10100E" font-family="'PP Mori Local', 'PP Mori', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.04em">BEAN</text>
  
  <!-- Subtitle "EXTRACTION LAB" -->
  <rect x="10" y="73" width="9" height="9" fill="#F24405" />
  <text x="27" y="81" fill="#10100E" font-family="'PP Mori Local', 'PP Mori', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.25em">EXTRACTION LAB</text>

  <!-- Vertical Divider Line -->
  <line x1="198" y1="10" x2="198" y2="80" stroke="#10100E" stroke-width="1.2" opacity="0.8" />

  <!-- Chemex Brand Mark (Right) -->
  <g transform="translate(216, 5) scale(0.8)" stroke="#10100E">
    <!-- Top Dripper -->
    <path d="M 18 10 H 82 L 67 38 H 33 Z" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Dripper Ribs -->
    <path d="M 50 10 V 38" stroke-width="3" stroke-linecap="round" />
    <path d="M 34 10 L 42 38" stroke-width="3" stroke-linecap="round" />
    <path d="M 66 10 L 58 38" stroke-width="3" stroke-linecap="round" />
    <path d="M 22 10 L 37 38" stroke-width="3" stroke-linecap="round" />
    <path d="M 78 10 L 63 38" stroke-width="3" stroke-linecap="round" />
    <!-- Neck Collar -->
    <path d="M 31 43 H 69 C 71.5 43, 71.5 49, 69 49 H 31 C 28.5 49, 28.5 43, 31 43 Z" fill="#10100E" stroke="none" />
    <!-- Carafe Body -->
    <path d="M 34 49 C 30 56, 17 65, 17 78 C 17 87, 26 89, 34 89 H 66 C 74 89, 83 87, 83 78 C 83 65, 70 56, 66 49" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Handle -->
    <path d="M 68 53 H 82 C 86.5 53, 90 57, 88 68 L 84 76 C 82 78, 77 78, 74 76" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Coffee Liquid -->
    <path d="M 21 68 H 79 C 80 73, 81.5 77, 81.5 79 C 81.5 84.5, 75 87.5, 66 87.5 H 34 C 25 87.5, 18.5 84.5, 18.5 79 C 18.5 77, 20 73, 21 68 Z" fill="#10100E" stroke="none" />
  </g>
</svg>
